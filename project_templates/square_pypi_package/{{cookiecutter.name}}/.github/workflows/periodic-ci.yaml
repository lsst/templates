# This is a separate run of the Python test suite that updates frozen
# dependencies and runs from a schedule. The purpose is to test compatibility
# with the latest versions of dependencies.

name: Periodic CI

"on":
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python:
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools-scm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: {{ "${{ matrix.python }}" }}

      - name: Update dependencies
        run: make update-deps

      - name: Run nox
        run: uv run --only-group=nox nox -P $UV_PYTHON -s lint typing test
{% if cookiecutter.github_org == "lsst-sqre" %}
      - name: Report status
        if: failure()
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: {{ "${{ job.status }}" }}
          notify_when: "failure"
          notification_title: "Periodic test for {repo} failed"
        env:
          SLACK_WEBHOOK_URL: {{ "${{ secrets.SLACK_ALERT_WEBHOOK }}" }}
{%- endif %}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools-scm

      - name: Install Graphviz
        run: sudo apt-get install graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install extra packages
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Run nox
        run: uv run --only-group=nox nox -s docs docs-linkcheck
{% if cookiecutter.github_org == "lsst-sqre" %}
      - name: Report status
        if: failure()
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: {{ "${{ job.status }}" }}
          notify_when: "failure"
          notification_title: "Periodic documentation test for {repo} failed"
        env:
          SLACK_WEBHOOK_URL: {{ "${{ secrets.SLACK_ALERT_WEBHOOK }}" }}
{%- endif %}

  test-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, docs]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools-scm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build the packages
        run: uv build --no-sources --all-packages
{% if cookiecutter.github_org == "lsst-sqre" %}
      - name: Report status
        if: failure()
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: {{ "${{ job.status }}" }}
          notify_when: "failure"
          notification_title: "Periodic packaging test for {repo} failed"
        env:
          SLACK_WEBHOOK_URL: {{ "${{ secrets.SLACK_ALERT_WEBHOOK }}" }}
{%- endif %}
